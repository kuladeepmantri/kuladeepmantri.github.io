# Builds the static export and deploys it to GitHub Pages.
name: Deploy Next.js site to Pages

on:
  push:
    branches: ['main']

  # Hourly, so scripts/fetch-live.ts picks up new GitHub and X activity even
  # when no code changed. Off the top of the hour to avoid the rush. A run
  # deploys only when its result differs from the live site.
  schedule:
    - cron: '7 * * * *'

  workflow_dispatch:
    inputs:
      x_full_refresh:
        description: 'Refetch X posts from scratch (a deleted post drops out now, not at the daily refresh)'
        type: boolean
        default: false
      force_deploy:
        description: 'Deploy even if nothing changed'
        type: boolean
        default: false

# Nothing by default; each job asks for what it needs.
permissions: {}

# One deployment at a time. Queued runs wait; an in-progress deploy is never cancelled.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      # The only step that sees the tokens. GH_PAT is optional (a fine-grained,
      # read-only token); without it the job's own read-only GITHUB_TOKEN is used.
      - name: Fetch live data
        run: npx --no-install tsx scripts/fetch-live.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_FULL_REFRESH: ${{ inputs.x_full_refresh && '1' || '' }}

      # `next build` directly, with no secrets: `npm run build` would run
      # fetch-live again through prebuild, without tokens.
      - name: Build
        run: npx --no-install next build

      - name: Add Content-Security-Policy
        run: npx --no-install tsx scripts/csp.ts out

      - name: Check for GPS data in shipped files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libimage-exiftool-perl > /dev/null
          # -r. also walks dot-directories such as .well-known.
          found=$(exiftool -r. -q -q -m -if '$GPSLatitude or $GPSLongitude or $GPSPosition' \
            -p '$Directory/$FileName' out || true)
          if [ -n "$found" ]; then
            echo "::error::These files carry GPS location data. Strip it first (exiftool -all= FILE):"
            echo "$found"
            exit 1
          fi

      - name: Check security.txt is in the export
        run: test -f out/.well-known/security.txt

      # Same commit and same live data (ignoring the build time) as the live
      # site means there is nothing to deploy. Any doubt deploys.
      - name: Compare with the live site
        id: compare
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          FORCE: ${{ inputs.force_deploy && 'true' || 'false' }}
        run: |
          live=$(curl -fsS --max-time 15 "$SITE/live.json?t=$(date +%s)" || true)
          new=$(jq -cS 'del(.builtAt)' out/live.json)
          old=$(printf '%s' "$live" | jq -cS 'del(.builtAt)' 2> /dev/null || true)
          if [ "$FORCE" != 'true' ] && [ -n "$old" ] && [ "$new" = "$old" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Nothing new since the live build; skipping the deploy.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out
          # Without this, v4 and later drop dot-directories: /.well-known/security.txt.
          include-hidden-files: true

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Check security.txt is served
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: curl -fsSI --retry 3 --retry-delay 10 "${PAGE_URL%/}/.well-known/security.txt" > /dev/null
